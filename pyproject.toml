[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-eidolon-memory"
version = "1.0.0"
description = "Eidolon Agent Memory plugin for Hermes Agent — long-term semantic memory with fact triples, pgvector embeddings, episodic memory, and companion profiles."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Eidolon Labs", email = "hello@eidolonlabs.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/eidolonlabs-ai/hermes-eidolon-memory"
Repository = "https://github.com/eidolonlabs-ai/hermes-eidolon-memory"

[project.entry-points."hermes_agent.plugins"]
eidolon = "hermes_eidolon_memory"

[tool.setuptools.packages.find]
where = ["src"]
